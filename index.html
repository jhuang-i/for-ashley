<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,noarchive">
<title>For Ashley</title>
<style>
:root{color-scheme:dark;background:#141021;color:#fbf0fa;font:16px/1.65 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#46304f 0%,#21182f 45%,#141021 85%)}main{width:min(100% - 2rem,700px);margin:auto;padding:clamp(34px,9vw,98px) 0 64px}header{text-align:center;margin:0 auto 32px}.moon{display:inline-grid;place-items:center;width:64px;height:64px;border:1px solid #9878a2;border-radius:50%;font-size:2rem;color:#f6d1ed;background:#55395f;box-shadow:0 0 46px #e0a9d755;margin-bottom:18px}.eyebrow,time{font-size:.85rem;color:#ecc4e6;letter-spacing:.09em}h1,h2,.letter{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(2.7rem,9vw,5rem);line-height:1.02;letter-spacing:-.05em;margin:0 0 13px}h2{margin:0 0 12px;font-size:1.65rem}.card,details{border:1px solid #5a4568;background:#21192e;border-radius:18px;padding:clamp(21px,5vw,36px)}.card .eyebrow{margin:0 0 12px}.letter{font-size:clamp(1.24rem,3vw,1.52rem);line-height:1.65;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.archive{margin-top:34px}details{margin-bottom:10px;padding:12px 17px}summary{cursor:pointer;color:#f8e3f5}details .letter{font-size:1.17rem;margin-bottom:10px}.links{display:flex;justify-content:space-between;gap:10px;margin-top:14px}a{color:#ecc4e6}summary:focus-visible,a:focus-visible{outline:2px solid #ecc4e6;outline-offset:4px}

.card h2{font-size:1.15rem;color:#ecc4e6;margin:0 0 18px}.card .archive-link{display:inline-block;margin-top:18px}
.archive summary{padding:4px 0}.archive details[open] summary{margin-bottom:12px}
@media(max-width:480px){main{padding-top:32px}header{margin-bottom:24px}.moon{width:52px;height:52px}}

:root{background:#130e20}body{background:radial-gradient(ellipse at 50% 0%,#4d3054,transparent 55%),#130e20}
header{margin-bottom:40px}h1{font-style:italic}.moon{color:#f8dca3;border-color:#c09a78;background:#432c4f}
.card{background:linear-gradient(155deg,#f8eee7,#f1dcf1);color:#34213b;border-color:#e9cfe9;box-shadow:0 24px 58px #09060d70}
.card h2,.card .eyebrow,.card a,.card summary{color:#653861}.card details{border:0;background:transparent;padding:0;margin:0}.card details:not([open]) summary{margin:0}
.envelope summary{display:flex;align-items:center;gap:.75rem;font:1.3rem Georgia,serif;min-height:48px;list-style:none}.envelope summary::-webkit-details-marker{display:none}.envelope summary::before{content:'✉';font-size:1.5em}.envelope[open] summary{border-bottom:1px solid #bc99bb;padding-bottom:12px}.card summary:focus-visible{outline-color:#653861}
.archive label{display:grid;gap:6px;margin-bottom:14px;color:#ecc4e6}.archive input{width:100%;font:inherit;padding:9px 12px;background:#21192e;color:#fbf0fa;border:1px solid #8b719b;border-radius:9px}.month{margin:20px 0 8px;color:#ecc4e6;font-family:Georgia,serif;font-size:1.15rem}
</style>
</head>
<body><main>
<header><span class="moon" aria-hidden="true">☾</span><h1>For Ashley</h1><time id="date"></time></header>
<article class="card" aria-label="Featured note" aria-live="polite" id="today"><p class="letter">Opening today’s note…</p></article>
<section class="archive" id="archive" hidden><h2>Earlier notes</h2><label>Search earlier notes<input type="search" id="search" placeholder="Search by words, date, or occasion"></label><div id="earlier"></div></section>
</main>
<script>
const eastern = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' });
const longDate = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
const today = eastern.format(new Date());
const pretty = day => longDate.format(new Date(day + 'T12:00:00Z'));
const date = document.querySelector('#date');
date.dateTime = today;
date.textContent = pretty(today);
const current = document.querySelector('#today');
function paragraph(className, text) {
  const element = document.createElement('p');
  element.className = className;
  element.textContent = text;
  return element;
}
function noteContent(note) {
  return [paragraph('eyebrow', note.occasion || 'A note for Ashley'), paragraph('letter', note.message)];
}
async function showNotes() {
  try {
    const response = await fetch('./notes.json', { cache: 'no-cache' });
    if (!response.ok) throw new Error('Notes unavailable');
    const entries = await response.json();
    const notes = new Map();
    for (const note of entries) {
      if (!note || typeof note.day !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(note.day) || typeof note.message !== 'string' || !note.message.trim()) continue;
      const date = new Date(note.day + 'T12:00:00Z');
      if (Number.isNaN(date.getTime()) || date.toISOString().slice(0, 10) !== note.day) continue;
      notes.set(note.day, note);
    }
    const note = notes.get(today);
    const earlier = [...notes.keys()].filter(day => day < today).sort().reverse();
    const newest = earlier[0];
    const title = document.createElement('h2');
    title.textContent = note ? 'Today’s note' : newest ? 'Latest note · ' + pretty(newest) : 'Today’s note';
    const featured = note || notes.get(newest);
    current.replaceChildren(title);
    if (featured) {
      const envelope = document.createElement('details');
      envelope.className = 'envelope';
      try { envelope.open = sessionStorage.getItem('ashley-opened-' + featured.day) === 'yes'; } catch {}
      const seal = document.createElement('summary');
      seal.textContent = envelope.open ? 'Your letter' : 'Open your letter';
      envelope.append(seal, ...noteContent(featured));
      envelope.addEventListener('toggle', () => {
        seal.textContent = envelope.open ? 'Your letter' : 'Open your letter';
        try { sessionStorage.setItem('ashley-opened-' + featured.day, envelope.open ? 'yes' : 'no'); }
        catch {}
      });
      current.append(envelope);
    } else {
      current.append(paragraph('letter', 'There’s no new note for today yet. I’m glad you stopped by, Ashley.'));
    }
    const archive = document.querySelector('#earlier');
    if (earlier.length) {
      const link = document.createElement('a');
      link.href = '#archive';
      link.className = 'archive-link';
      link.textContent = 'Browse earlier notes';
      current.append(link);
    }
    const search = document.querySelector('#search');
    const monthName = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'long', year: 'numeric' });
    function renderArchive() {
      const query = search.value.trim().toLowerCase();
      archive.replaceChildren();
      let month = '';
      for (const day of earlier) {
        const entry = notes.get(day);
        const dateLabel = pretty(day);
        if (![day, dateLabel, entry.occasion, entry.message].join(' ').toLowerCase().includes(query)) continue;
        if (day.slice(0, 7) !== month) {
          month = day.slice(0, 7);
          const heading = document.createElement('h3');
          heading.className = 'month';
          heading.textContent = monthName.format(new Date(day + 'T12:00:00Z'));
          archive.append(heading);
        }
        const item = document.createElement('details');
        const label = document.createElement('summary');
        label.textContent = dateLabel;
        item.append(label, ...noteContent(entry));
        archive.append(item);
      }
      if (!archive.children.length && query) archive.append(paragraph('eyebrow', 'No earlier notes match.'));
    }
    search.addEventListener('input', renderArchive);
    renderArchive();
    document.querySelector('#archive').hidden = earlier.length === 0;
  } catch {
    current.replaceChildren(paragraph('letter', 'The notes couldn’t load. Please try refreshing the page.'));
  }
}
showNotes();
</script>
</body></html>
